<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="0.55" stop-color="#14171C"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9E0010"/>
      <stop offset="0.5" stop-color="#E60012"/>
      <stop offset="1" stop-color="#FF3346"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F7"/>
      <stop offset="0.5" stop-color="#C7CCD1"/>
      <stop offset="1" stop-color="#7C838C"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="180" fill="url(#grid)"/>

  <!-- franjas rallye -->
  <g transform="rotate(-20 760 220)">
    <rect x="620" y="-260" width="120" height="1600" fill="url(#red)" opacity="0.95"/>
    <rect x="770" y="-260" width="26" height="1600" fill="url(#silver)" opacity="0.9"/>
    <rect x="826" y="-260" width="10" height="1600" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- 7 fantasma -->
  <text x="700" y="800" font-family="Arial Black, Arial, sans-serif" font-style="italic"
        font-weight="900" font-size="520" fill="#FFFFFF" opacity="0.04">7</text>

  <!-- monograma C -->
  <g filter="url(#glow)">
    <text x="250" y="705" font-family="Arial Black, Arial, sans-serif" font-style="italic"
          font-weight="900" font-size="500" fill="#FFFFFF" letter-spacing="-24">C</text>
  </g>

  <!-- wordmark -->
  <text x="118" y="878" font-family="Arial Black, Arial, sans-serif" font-style="italic"
        font-weight="900" font-size="92" fill="#FFFFFF" letter-spacing="10">COPI</text>
  <text x="124" y="928" font-family="Arial, sans-serif" font-weight="700"
        font-size="26" fill="#E60012" letter-spacing="12">COPILOTO DE RALLY</text>

  <!-- detalles -->
  <rect x="118" y="778" width="118" height="8" rx="4" fill="#E60012"/>
  <circle cx="880" cy="150" r="10" fill="#63E6A6"/>
</svg>
